name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:action
      # `uses: Inn-Keeper/intygy@…` runs the committed bundle, so it must match src.
      - name: Committed dist is up to date
        run: git diff --exit-code packages/action/dist || (echo "::error::Run pnpm build:action and commit dist." && exit 1)
