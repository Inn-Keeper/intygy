name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: intygy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      INTYGY_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/intygy_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @intygy/action exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:action
      # `uses: Inn-Keeper/intygy@…` runs the committed bundle, so it must match src.
      - name: Committed dist is up to date
        run: git diff --exit-code packages/action/dist || (echo "::error::Run pnpm build:action and commit dist." && exit 1)
