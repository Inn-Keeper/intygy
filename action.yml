name: "Intygy Accessibility Check"
description: "Scans configured routes with axe-core + Playwright and reports every failing element to Intygy. Fails on new PR findings."
branding:
  icon: "check-circle"
  color: "green"
inputs:
  api-key:
    description: "Your Intygy project API key (store as a repo secret)."
    required: true
  api-base:
    description: "Intygy API base URL, e.g. https://intygy.example.com."
    required: true
  config-path:
    description: "Path to intygy.yml in the repository."
    required: false
    default: "intygy.yml"
runs:
  using: "node24"
  main: "packages/action/dist/index.js"
