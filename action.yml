name: "Intygy Accessibility Check"
description: "Scans the routes your PR affects with axe-core + Playwright and reports results to Intygy. Fails on new WCAG violations."
branding:
  icon: "check-circle"
  color: "green"
inputs:
  api-key:
    description: "Your Intygy project API key (store as a repo secret)."
    required: true
  api-base:
    description: "Intygy API base URL, e.g. https://intygy.example.com."
    required: true
  config-path:
    description: "Path to intygy.yml in the repository."
    required: false
    default: "intygy.yml"
runs:
  using: "node24"
  main: "packages/action/dist/index.js"
