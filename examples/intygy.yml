# Copy to the ROOT of the repo you want to protect
target: preview          # uses your Vercel/Netlify preview deployment
# target:                # …or serve the app inside CI instead:
#   serve: "npm run build && npm run start"
#   url: "http://localhost:3000"

routes:
  - /
  - /products
  - /checkout

# Choose an application-specific marker that is visible only after each page loads.
readySelector: "main"
readyTimeoutMs: 15000
# When configuring auth, also set auth.success_selector to an authenticated marker
# visible after login and on every scanned page (for example a sign-out button).

ruleset: wcag22-aa
viewports: [desktop, mobile]
# Baseline is always server-side: first scan establishes it; PRs block only new violations.
