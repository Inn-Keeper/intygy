# Copy to .github/workflows/intygy.yml in the repo you want to protect
name: Accessibility check
on:
  pull_request:
  push:
    branches: [main]   # post-merge scan: updates baseline + marks resolved issues

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Inn-Keeper/intygy@v1
        with:
          api-key: ${{ secrets.INTYGY_KEY }}
          api-base: https://YOUR_DEPLOYED_API_URL
        env:
          # Customer repo token — used by the Action to find Vercel/Netlify preview URLs.
          # The Intygy GitHub App (operator-hosted) posts PR comments separately.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
